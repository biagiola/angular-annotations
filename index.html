<div>
    <!-- tenemos que agregar el css condicionalmente si el usuario fue seleccionado -->
    <button (click)="onSelectUser()">
        <img [src]="imagePath" [alt]="user.name">
        <span>{{ user.name }}</span>
    </button>
</div>


<article>
    <h2>{{ task.title }}</h2>
    <time>{{ task.time }}</time>
    <p>{{ task.summary }}</p>
    <p class="actions">
        <button (click)>Complete</button>
    </p>
</article>
